# @package _global_
name: inference
seed: 42
print_config: True
ignore_warnings: True

# Inference parameters
ckpt_paths: []  # List of checkpoint paths or directories to scan recursively for .ckpt files
gpu: 0  # GPU device index

# Dataset splits to run inference on (must be a list)
split:
  - val_no_sparse
  - val_no_trans_ref
  - val_all_enabled
  - synth_val_no_sparse
  - synth_val_no_trans_ref
  - synth_val_all_enabled

# Output directory (derived from checkpoint path)
predictions_dir: ${oc.env:PREDICTIONS_DIR}

# Defaults for model components
defaults:
  - /datamodule@datamodule: indoor
  - /algorithm@algorithm: indoor
  - /network@network: txunet
  - _self_

# Override datamodule for inference mode
datamodule:
  inference: True  # Enable inference mode for original-size targets
  batch_size: 1  # Process one sample at a time for inference
  use_synthetic_train: True

hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR}/inference/${now:%Y-%m-%d_%H-%M-%S.%f}
  job:
    chdir: True
