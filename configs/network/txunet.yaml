_target_: src.networks.TxUNetModel

name: txunet
in_ch: 11
out_ch: 1
base_ch: 48
depths: [ 4, 6, 6, 8 ]
heads: [ 4, 4, 8, 8 ]
expand: 2.66
use_checkpoint: False
ln_eps: 1e-5
window0: null
window0_stride: null
sra0_enabled: True
sra0_stride: 4
rope_enabled: True
rope_base: 10000.0
nsa_enabled: False
nsa_patch_sizes: [8, 8, 4, 4]
nsa_top_n: [32, 16, 16, 16]
nsa_window_sizes: [16, 16, 8, 8]
nsa_gqa_group_size: 1   # 1=MHA, 4=GQA with 4:1 ratio
nsa_levels: null        # null=all levels, [0, 1]=only L0+L1 use NSA
nsa_importance_chunk_size: null   # null=auto chunking; set int for fixed chunk size
nsa_importance_use_mem_get_info: true  # false avoids per-step mem_get_info sync (use with fixed chunk)
ffn_internal_residual: true  # true=legacy (residual inside FFN), false=standard pre-LN
