# @package _global_
defaults:
  - trainer: default
  - datamodule: indoor
  - optimizer: adam
  - scheduler: null
  - algorithm: indoor
  - network: txunet
  - callbacks: [ tqdm_progress_bar, model_checkpoint_0, model_checkpoint_every_4, val_alias_e3 ]
  - loggers: [ aim ]
  - strategy: null
  - _self_

name: train
seed: 42
print_config: True
ignore_warnings: True
fast_dev: false

ckpt_path: null
load_weights_only: True

datamodule:
  name: finetune_train_full_task2
  use_small_train: False
  train_samples_per_epoch: 960
  # Modality dropout: prob of turning off one modality (trans+ref OR sparse)
  modality_dropout_prob: 0.0
  train_manifest_path: ${oc.env:ICASSP_TRAIN_MANIFEST_TASK_1}
  train_small_manifest_path: ${oc.env:ICASSP_TRAIN_SMALL_MANIFEST_TASK_1}
  val_manifest_path: ${oc.env:ICASSP_VAL_MANIFEST_TASK_1}
  # If dropout happens, prob of choosing sparse to turn off (vs trans+ref)
  sparse_dropout_given_dropout: 0.5
  synthetic_dir: ""
  synthetic_manifest_path: ""
  synthetic_val_manifest_path: ""
  val_sparse_ranges:
    - [0.0002, 0.0002]
    - [0.005, 0.005]
  # Finetuning augmentations: cardinal rotation + synthetic wall insertion
  train_augmentations:
    _target_: src.utils.indoor.augmentations.AugmentationPipeline
    augmentations:
      - _target_: src.utils.indoor.augmentations.CardinalRotationAugmentation
        p: 1.0
      - _target_: src.utils.indoor.augmentations.WallInsertionAugmentation
        p: 0.5
        transmittance_range: [2, 18]
        max_wall_density: 0.05

callbacks:
  model_checkpoint_0:
    dirpath: runs/e3/checkpoints/hard
  model_checkpoint_every_4:
    dirpath: runs/e3/checkpoints/every

loggers:
  aim:
    experiment: v4_e3

algorithm:
  finetune:
    enable: True
    include_patterns: []
    exclude_patterns: []

hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR}/train/${now:%Y-%m-%d_%H-%M-%S.%f}
  job:
    chdir: True
