# @package _global_
name: inference
seed: 42
print_config: True
ignore_warnings: True

ckpt_paths: []
gpu: 0

split:
  - test

predictions_dir: ${oc.env:PREDICTIONS_DIR}

defaults:
  - datamodule: icassp_task3
  - algorithm: indoor
  - network: txunet
  - _self_

datamodule:
  _target_: src.datamodules.IndoorDatamodule
  name: icassp_task3_dataset
  batch_size: 1  # overrides
  num_workers: 20
  data_dir: ${oc.env:ICASSP_ORIG_PATH}
  synthetic_dir: ${oc.env:SYNTH_ROOT}
  inference: True  # overrides
  freqs_mhz: [ 868, 1800, 3500 ]
  freqs: [ 1, 2, 3 ]
  sparse_range: [ 0, 0 ]
  modality_dropout_prob: 0
  sparse_dropout_given_dropout: 1.0
  val_sparse_ranges:
    - [0.0002, 0.0002]
    - [0.005, 0.005]
  train_augmentations:
    _target_: src.utils.indoor.augmentations.AugmentationPipeline
    augmentations:
      - _target_: src.utils.indoor.augmentations.CardinalRotationAugmentation
        p: 1.0
      - _target_: src.utils.indoor.augmentations.WallInsertionAugmentation
        p: 0.5
        transmittance_range: [2, 18]
        max_wall_density: 0.05
  use_synthetic_train: False
  use_small_train: False
  train_manifest_path: ${oc.env:ICASSP_TRAIN_MANIFEST_TASK_3}
  train_small_manifest_path: ${oc.env:ICASSP_TRAIN_SMALL_MANIFEST_TASK_3}
  val_manifest_path: ${oc.env:ICASSP_VAL_MANIFEST_TASK_3}
  synthetic_manifest_path: ${oc.env:SYNTH_TRAIN_MANIFEST}
  synthetic_val_manifest_path: ${oc.env:SYNTH_VAL_MANIFEST}
  test_manifest_path:
    - ${oc.env:ICASSP_TEST_MANIFEST_TASK_3}
  synthetic_limit: null
  train_samples_per_epoch: 22200
  multi_gpu: False

algorithm:
  _target_: src.algorithms.Indoor
  name: indoor
  out_norm: 160
  fixed_scale: False
  use_sip2net: False
  sip2net_params:
    mse_weight: 0.02
    alpha1: 500.0
    alpha2: 1.0
    alpha3: 0.0
  compiled:
    _target_: src.utils.CompileParams
    fullgraph: True
    dynamic: False
    backend: inductor
    mode: max-autotune
    options: null
    disable: False
  finetune:
    enable: False
    ckpt_path: null
    freeze_encoder_epochs: 0
    bn_recalibration:
      enable: False
      num_batches: 200
    l2sp:
      enable: False
      alpha: 1e-4
      include_patterns: []
      exclude_patterns: []
    teacher_anchoring:
      enable: False
      alpha: 0.1

network:
  _target_: src.networks.TxUNetModel
  name: txunet
  in_ch: 11
  out_ch: 1
  base_ch: 48
  depths: [ 4, 6, 6, 8 ]
  heads: [ 4, 4, 8, 8 ]
  expand: 2.66
  use_checkpoint: False
  ln_eps: 1e-5
  window0: null
  window0_stride: null
  sra0_enabled: True
  sra0_stride: 4

hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR}/inference/${now:%Y-%m-%d_%H-%M-%S.%f}
  job:
    chdir: True
