_target_: src.algorithms.MLSP

name: mlsp

out_norm: 160
fixed_scale: False
use_sip2net: False
sip2net_params:
  mse_weight: 0.02
  alpha1: 500.0
  alpha2: 1.0
  alpha3: 0.0

compiled:
  _target_: src.utils.CompileParams
  fullgraph: False
  dynamic: null
  backend: inductor
  mode: null
  options: null
  disable: True

finetune:
  enable: False
  # Path to pretrained checkpoint for weights-only loading (no optimizer state)
  ckpt_path: null
  # Encoder freeze schedule (epochs to keep encoder frozen at start)
  freeze_encoder_epochs: 0
  # Discriminative LRs: scale encoder lr by factor relative to base lr
  discriminative_lr:
    enable: False
    encoder_lr_factor: 0.25
  # Warmup schedule (linear warmup of lr from warmup_factor*base to base over warmup_epochs)
  warmup:
    enable: False
    warmup_epochs: 5
    warmup_factor: 0.25
  # BatchNorm recalibration on target data before training
  bn_recalibration:
    enable: False
    num_batches: 100
  # L2-SP regularization to pretrained weights
  l2sp:
    enable: False
    alpha: 1e-4
    include_patterns: ["encoder"]  # regex or substrings; empty means all
    exclude_patterns: ["bias", "bn", "running"]