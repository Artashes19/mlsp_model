# @package _global_
name: train
seed: 123

# training uses synthetic only; validation uses ICASSP via data_dir
split_role: train_full

defaults:
  - override /trainer: default
  - override /datamodule: mlsp
  - override /optimizer: adam
  - override /scheduler: wsd_s
  - override /algorithm: mlsp
  - override /network: mlsp_unet
  - override /loggers: [ aim ]
  - override /strategy: null
  - _self_

trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: gpu
  devices: [ 0 ]
  use_distributed_sampler: True
  precision: 16
  max_epochs: 1100

datamodule:
  name: synth_only_pretrain
  data_dir: ${oc.env:ICASSP_ORIG_PATH}
  synthetic_dir: ${oc.env:SYNTHETIC_TRAIN_DIR}
  use_synthetic_train: true
  icassp_train_path: null
  icassp_val_buildings: validation  # resolved from split.json by orchestrator
  val_freq: [ 1, 2, 3 ]
  train_subset_size: null
  split_save_path: ./splits/e2.pkl
  icassp_val_subsample_ratio: 1.0
  # Optional: number of training samples per epoch (null => full dataset)
  train_samples_per_epoch: 16000

callbacks:
  model_checkpoint_0:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 1
    save_last: true
    verbose: false
    dirpath: e2/checkpoints/hard
    filename: epoch_{epoch:04d}
    auto_insert_metric_name: false
  model_checkpoint_every:
    _target_: src.utils.scheduled_checkpoint.ScheduledEpochModelCheckpoint
    monitor: null
    save_top_k: -1
    save_last: true
    verbose: false
    dirpath: e2/checkpoints/every
    filename: epoch_{epoch:04d}_every
    auto_insert_metric_name: false
    schedule_epochs: [ 4, 9, 19, 39, 79, 159, 319 ]

loggers:
  aim:
    _target_: aim.pytorch_lightning.AimLogger
    repo: ${oc.env:AIM_REPO}
    experiment: default_e2

scheduler:
  wsd_s:
    _target_: src.schedulers.wsd_s.WSDScheduler

    warmup_steps: 1000
    stable_steps:
      - 3000
      - 4000
      - 8000
      - 16000
      - 32000
      - 64000
      - 128000
    decay_steps:
      - 1000
      - 1000
      - 2000
      - 4000
      - 8000
      - 16000
      - 32000
    peak_lr: 0.0003
    last_epoch: -1

hydra:
  sweeper: null


