trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: gpu
  devices: [0]
  use_distributed_sampler: True
  precision: 32
  max_epochs: 300

# @package _global_
name: train
seed: 123

split_role: train_small

defaults:
  - override /datamodule: mlsp
  - override /optimizer: adam
  - override /scheduler: null
  - override /algorithm: mlsp
  - override /network: mlsp_unet
  - override /trainer: default
  - override /loggers: [ aim ]
  - override /strategy: null
  - _self_

datamodule:
  name: finetune_train_small
  data_dir: ${oc.env:ICASSP_ORIG_PATH}
  icassp_train_path: null
  icassp_train_buildings: train_small
  icassp_val_buildings: validation  # resolved from split.json by orchestrator
  val_freq: [ 1, 2, 3 ]
  train_subset_size: null
  split_save_path: ./splits/e3.pkl
  icassp_val_subsample_ratio: 1.0

algorithm:
  finetune:
    enable: true
    ckpt_path: null  # run-time will require e2 to have produced a checkpoint or crash
    freeze_encoder_epochs: 5
    discriminative_lr:
      enable: true
      encoder_lr_factor: 0.1
    warmup:
      enable: true
      warmup_epochs: 5
      warmup_factor: 0.1
    bn_recalibration:
      enable: true
      num_batches: 200
    l2sp:
      enable: true
      alpha: 1e-4
      include_patterns: ["encoder"]

callbacks:
  best_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 1
    save_last: false
    verbose: false
    dirpath: runs/e3/checkpoints
    filename: epoch_{epoch:04d}
    auto_insert_metric_name: false
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_loss
    mode: min
    patience: 30
    min_delta: 0.0
    verbose: false
    check_on_train_epoch_end: true

hydra:
  sweeper: null


