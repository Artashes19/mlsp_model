# @package _global_
name: train
seed: 123

defaults:
  - override /datamodule: mlsp
  - override /optimizer: adam
  - override /scheduler: null
  - override /algorithm: mlsp
  - override /network: mlsp_unet
  - override /trainer: default
  - override /callbacks: [ model_checkpoint_0 ]
  - override /loggers: [ aim ]
  - override /strategy: null
  - _self_

datamodule:
  name: synth_pretrain_icassp1k_finetune
  data_dir: ${oc.env:ICASSP_ORIG_PATH}
  icassp_train_path: ${oc.env:ICASSP_ORIG_PATH}
  val_buildings: [ 21, 22, 23, 24, 25 ]
  val_freq: [ 1, 2, 3 ]
  train_subset_size: 1000
  train_subset_seed: 123
  split_save_path: ./splits/e3_icassp1k_finetune.pkl
  icassp_val_subsample_ratio: 1.0

ckpt_path: ./runs/e1/checkpoints/hard/last.ckpt

callbacks:
  model_checkpoint_0:
    dirpath: runs/e3/checkpoints/hard

