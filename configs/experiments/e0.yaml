trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: gpu
  devices: [0]
  use_distributed_sampler: True
  precision: 32
  max_epochs: 300

# @package _global_
name: train
seed: 123

split_role: train_small

defaults:
  - override /datamodule: mlsp
  - override /optimizer: adam
  - override /scheduler: null
  - override /algorithm: mlsp
  - override /network: mlsp_unet
  - override /trainer: default
  - override /loggers: [ aim ]
  - override /strategy: null
  - _self_

datamodule:
  name: icassp_train_small
  data_dir: ${oc.env:ICASSP_ORIG_PATH}
  icassp_train_path: null
  icassp_train_buildings: train_small
  icassp_val_buildings: validation  # resolved from split.json by orchestrator
  val_freq: [ 1, 2, 3 ]
  train_subset_size: null
  split_save_path: ./splits/e0.pkl
  icassp_val_subsample_ratio: 1.0

  # Sparse measurement controls
  sparse_prob: 0.333333333333
  sparse_range: [ 0.0, 0.01 ]

callbacks:
  best_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 1
    save_last: false
    verbose: false
    dirpath: runs/e0/checkpoints
    filename: epoch_{epoch:04d}
    auto_insert_metric_name: false
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_loss
    mode: min
    patience: 30
    min_delta: 0.0
    verbose: false
    check_on_train_epoch_end: true

hydra:
  sweeper: null


