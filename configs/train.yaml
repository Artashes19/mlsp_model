# @package _global_
name: train
seed: 0
print_config: True
ignore_warnings: True
terminal_col: null
terminal_row: 24

defaults:
  - trainer: default
  - datamodule: mlsp
  - optimizer: adam
  - scheduler: null
  - algorithm: mlsp
  - network: mlsp_unet
  - callbacks: [ model_checkpoint_0 ]
  - loggers: [ aim ]
  - strategy: null
  - _self_

ckpt_path: null

# Multi-experiment orchestrator controls
exps: ""  # e.g., "e1,e2,e3,e4"
exp_dir: ""  # optional explicit experiments directory
experiments_root: experiments
experiments_config_dir: null

split:
  train_small_n: 7
  train_full_n: 20
  validation_n: 5

data:
  real_dir: ${datamodule.data_dir}
  synthetic_dir: ""

# Developer convenience: cap training for quick smoke tests
fast_dev: false

hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR}/${now:%Y-%m-%d_%H-%M-%S.%f}
  job:
    chdir: True
  sweeper:
    params:
      +exp: ""