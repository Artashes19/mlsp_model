# @package _global_
name: train
seed: 42
print_config: True
ignore_warnings: True
terminal_col: null
terminal_row: 24

# Multi-experiment orchestrator controls
defaults:
  - exps: [ e0, e1, e2, e3 ]  # e.g., "e1,e2,e3,e4"
  - _self_

# Developer convenience: cap training for quick smoke tests
fast_dev: false

hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR}/${now:%Y-%m-%d_%H-%M-%S.%f}
  job:
    chdir: True
  sweeper:
    params:
      +exp: ""