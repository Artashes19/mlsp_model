# @package _global_
name: train
seed: 42
print_config: True
ignore_warnings: True
fast_dev: false

ckpt_path: null
load_weights_only: False

defaults:
  - _self_
  - trainer: null # default
  - strategy: null
  - datamodule: null # icassp_task1
  - algorithm: null # indoor
  - network: null # txunet
  - optimizer: null # adam
  - scheduler: null # icassp1_sd_finetune_32
  - callbacks: null # [ tqdm_progress_bar, model_checkpoint_rt, model_checkpoint_every_4 ]
  - loggers: null # [ wandb ]

trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: gpu
  devices: [ 0 ]
  use_distributed_sampler: True
  precision: bf16-mixed
  max_epochs: 32  # overrides
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  num_sanity_val_steps: 0
  val_check_interval: 100
  check_val_every_n_epoch: null

datamodule:
  _target_: src.datamodules.IndoorDatamodule
  name: icassp_task1_dataset
  batch_size: 24
  num_workers: 20
  data_dir: ${oc.env:ICASSP_ORIG_PATH}
  synthetic_dir: ${oc.env:SYNTH_ROOT}
  inference: False
  freqs_mhz: [ 868, 1800, 3500 ]
  freqs: [ 1, 2, 3 ]
  sparse_range: [ 0, 0 ]
  modality_dropout_prob: 0
  sparse_dropout_given_dropout: 1.0
  val_modalities: [ "rt" ]
  val_sparse_ranges: [ ]  # overrides
  train_augmentations:
    _target_: src.utils.indoor.augmentations.AugmentationPipeline
    augmentations:
      - _target_: src.utils.indoor.augmentations.CardinalRotationAugmentation
        p: 1.0
      - _target_: src.utils.indoor.augmentations.WallInsertionAugmentation
        p: 0.5
        transmittance_range: [ 2, 18 ]
        max_wall_density: 0.05
  use_synthetic_train: False
  use_small_train: False
  train_manifest_path: ${oc.env:ICASSP_TRAIN_MANIFEST_TASK_1}
  train_small_manifest_path: ${oc.env:ICASSP_TRAIN_SMALL_MANIFEST_TASK_1}
  val_manifest_path: ${oc.env:ICASSP_VAL_MANIFEST_TASK_1}
  synthetic_manifest_path: ${oc.env:SYNTH_TRAIN_MANIFEST}
  synthetic_val_manifest_path: ${oc.env:SYNTH_VAL_MANIFEST}
  test_manifest_path:
    - ${oc.env:ICASSP_TEST_MANIFEST_TASK_1}
  synthetic_limit: null
  train_samples_per_epoch: 1000
  multi_gpu: False

optimizer:
  _target_: torch.optim.AdamW
  name: adam
  lr: 3e-4

scheduler:
  _target_: src.schedulers.wsd_s.WSDScheduler
  name: icassp1_sd_finetune_32
  warmup_samples: 0
  stable_samples:
    - 19200
  decay_samples:
    - 12800
  peak_lr: 0.0001
  min_lr_factor: 0.01
  last_epoch: -1
  interval: step
  frequency: 1

algorithm:
  _target_: src.algorithms.Indoor
  name: indoor
  log_every_n_steps: 100
  validation_names: [ "rt" ]
  out_norm: 160
  fixed_scale: False
  use_sip2net: False
  sip2net_params:
    mse_weight: 0.02
    alpha1: 500.0
    alpha2: 1.0
    alpha3: 0.0
  compiled:
    _target_: src.utils.CompileParams
    fullgraph: True
    dynamic: False
    backend: inductor
    mode: max-autotune
    options: null
    disable: False
  finetune:
    enable: False
    ckpt_path: null
    freeze_encoder_epochs: 0
    bn_recalibration:
      enable: False
      num_batches: 200
    l2sp:
      enable: False
      alpha: 1e-4
      include_patterns: [ ]
      exclude_patterns: [ ]
    teacher_anchoring:
      enable: False
      alpha: 0.1

network:
  _target_: src.networks.TxUNetModel
  name: txunet
  in_ch: 11
  out_ch: 1
  base_ch: 48
  depths: [ 4, 6, 6, 8 ]
  heads: [ 4, 4, 8, 8 ]
  expand: 2.66
  use_checkpoint: False
  ln_eps: 1e-5
  window0: null
  window0_stride: null
  sra0_enabled: True
  sra0_stride: 4

callbacks:
  tqdm_progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
  model_checkpoint_rt:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_rt_loss
    mode: min
    save_top_k: 1
    save_last: True
    verbose: False
    dirpath: checkpoints/rt
    filename: epoch_{epoch:04d}
    auto_insert_metric_name: False
  model_checkpoint_every_4:
    _target_: src.utils.every_n_epoch_checkpoint.EveryNEpochModelCheckpoint
    monitor: null
    save_top_k: -1
    save_last: false  # overrides
    verbose: false
    dirpath: checkpoints/every
    filename: epoch_{epoch:04d}_every
    auto_insert_metric_name: false
    every_n_epochs: 4

loggers:
  wandb:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: indoor
    name: v4_icassp_task1  # overrides
    save_dir: ${oc.env:WANDB_SAVE_DIR}

hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR}/train/${now:%Y-%m-%d_%H-%M-%S.%f}
  job:
    chdir: True
