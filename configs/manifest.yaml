# @package _global_
name: manifest
seed: 42
print_config: True

# Dataset paths
icassp_data_dir: ${oc.env:ICASSP_ORIG_PATH}
synthetic_dir: ${oc.env:SYNTH_ROOT}

# Validation configuration
val_buildings: [21, 22, 23, 24, 25]
train_small_n: 7  # Number of buildings for small training set
synthetic_val_size: 6240

# Frequency settings
freqs_mhz: [868, 1800, 3500]

# Task configuration
tasks: ["Task_1_ICASSP", "Task_2_ICASSP", "Task_3_ICASSP"]

# Toggle synthetic manifest generation
generate_synthetic: true

# Output directories (manifests will be written to {dataset_dir}/manifests/)
icassp_manifest_dir: ${oc.env:ICASSP_ORIG_PATH}/manifests
synthetic_manifest_dir: ${oc.env:SYNTH_ROOT}/manifests

hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR}/${now:%Y-%m-%d_%H-%M-%S.%f}_manifest
  job:
    chdir: True
