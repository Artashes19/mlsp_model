# @package _global_
defaults:
  - trainer: default
  - datamodule: indoor
  - optimizer: adam
  - scheduler: null
  - algorithm: indoor
  - network: unet
  - callbacks: [ tqdm_progress_bar, model_checkpoint_0 ]
  - loggers: [ aim ]
  - strategy: null
  - _self_

name: train
seed: 42
print_config: True
ignore_warnings: True
fast_dev: false

ckpt_path: null
load_weights_only: False
split_role: train_small

hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR}/train/${now:%Y-%m-%d_%H-%M-%S.%f}
  job:
    chdir: True
