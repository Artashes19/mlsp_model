_target_: pytorch_lightning.Trainer

accelerator: gpu
devices: [ 0 ]  # Uses cuda:0 by default
use_distributed_sampler: True
precision: bf16-mixed  # Mixed precision with bf16 (matches korean-model's AMP setup)
max_epochs: 20
accumulate_grad_batches: 1
gradient_clip_val: 1.0
gradient_clip_algorithm: norm  # L2 norm gradient clipping
num_sanity_val_steps: False
