icassp_task3:
  ckpt_path: null
  load_weights_only: False
  
  defaults:
    - trainer: default
    - datamodule: icassp_task3
    - optimizer: adam
    - scheduler: null
    - algorithm: indoor
    - network: txunet
    - callbacks: [ tqdm_progress_bar, model_checkpoint_0 ]
    - loggers: [ aim ]
    - strategy: null
    - _self_

  trainer:
    max_epochs: 8

  datamodule:
    train_samples_per_epoch: 42000

  callbacks:
    model_checkpoint_0:
      dirpath: runs/icassp_task3/checkpoints/hard

  loggers:
    aim:
      experiment: v3_icassp_task3
