e2:
  # training uses synthetic only; validation uses ICASSP via data_dir
  split_role: train_full
  ckpt_path: null
  load_weights_only: False

  defaults:
    - trainer: default
    - datamodule: mlsp
    - optimizer: adam
    - scheduler: wsd_s_pretraining_bs25
    - algorithm: mlsp
    - network: mlsp_txunet
    - callbacks: [ tqdm_progress_bar, model_checkpoint_0, model_checkpoint_every ]
    - loggers: [ aim ]
    - strategy: null
    - _self_

  datamodule:
    name: synth_only_pretrain
    icassp_train_buildings: null
    icassp_val_buildings: validation  # resolved from split.json by orchestrator
    split_save_path: ./splits/e2.pkl
    # Optional: number of training samples per epoch (null => full dataset)
    train_samples_per_epoch: 6240
    use_synthetic_train: True
    synthetic_dir: ${oc.env:SYNTHETIC_TRAIN_DIR}
    # Modality dropout: prob of turning off one modality (trans+ref OR sparse)
    modality_dropout_prob: 0.6666
    # If dropout happens, prob of choosing sparse to turn off (vs trans+ref)
    sparse_dropout_given_dropout: 0.5

  callbacks:
    model_checkpoint_0:
      dirpath: e2/checkpoints/hard
    model_checkpoint_every:
      dirpath: e2/checkpoints/every

  loggers:
    aim:
      experiment: v1_e2