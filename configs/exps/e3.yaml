e3:
  ckpt_path: null
  load_weights_only: True

  defaults:
    - trainer: default
    - datamodule: mlsp
    - optimizer: adam
    - scheduler: wsd_s_finetune_bs24
    - algorithm: mlsp
    - network: mlsp_txunet
    - callbacks: [ tqdm_progress_bar, model_checkpoint_0, early_stopping ]
    - loggers: [ aim ]
    - strategy: null
    - _self_

  datamodule:
    name: finetune_train_small
    use_small_train: True
    train_samples_per_epoch: 960
    # Modality dropout: prob of turning off one modality (trans+ref OR sparse)
    modality_dropout_prob: 0.6666
    # If dropout happens, prob of choosing sparse to turn off (vs trans+ref)
    sparse_dropout_given_dropout: 0.5

  callbacks:
    model_checkpoint_0:
      dirpath: runs/e3/checkpoints/hard

  loggers:
    aim:
      experiment: v1_e3

  algorithm:
    finetune:
      enable: True
      freeze_encoder_epochs: 0
      discriminative_lr:
        enable: True
      bn_recalibration:
        enable: True
      l2sp:
        enable: True