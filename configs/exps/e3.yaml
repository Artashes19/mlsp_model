e3:
  exp_name: e3
  ckpt_path: null
  load_weights_only: True

  defaults:
    - trainer: default
    - datamodule: indoor
    - optimizer: adam
    - scheduler: null
    - algorithm: indoor
    - network: txunet
    - callbacks: [ tqdm_progress_bar, model_checkpoint_0, model_checkpoint_every_10, val_alias_e3 ]
    - loggers: [ aim ]
    - strategy: null
    - _self_

  datamodule:
    name: finetune_train_full_task2
    use_small_train: False
    train_samples_per_epoch: 960
    # Modality dropout: prob of turning off one modality (trans+ref OR sparse)
    modality_dropout_prob: 0.0
    train_manifest_path: ${oc.env:ICASSP_TRAIN_MANIFEST_TASK_2}
    train_small_manifest_path: ${oc.env:ICASSP_TRAIN_SMALL_MANIFEST_TASK_2}
    val_manifest_path: ${oc.env:ICASSP_VAL_MANIFEST_TASK_2}
    # If dropout happens, prob of choosing sparse to turn off (vs trans+ref)
    sparse_dropout_given_dropout: 0.5
    synthetic_dir: ""
    synthetic_manifest_path: ""
    synthetic_val_manifest_path: ""
    val_sparse_ranges:
      - [0.002, 0.002]
      - [0.005, 0.005]

  callbacks:
    model_checkpoint_0:
      dirpath: runs/e3/checkpoints/hard
    model_checkpoint_every_10:
      dirpath: runs/e3/checkpoints/every

  loggers:
    aim:
      experiment: v3_e3

  algorithm:
    finetune:
      enable: True
      freeze_encoder_epochs: 0
      bn_recalibration:
        enable: True
      l2sp:
        enable: True
