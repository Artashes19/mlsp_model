_target_: src.datamodules.MLSPDatamodule

name: indoor_dataset
batch_size: 24
num_workers: 64

data_dir: ${oc.env:ICASSP_ORIG_PATH}
synthetic_dir: ${oc.env:SYNTH_ROOT}
inference: False

freqs_mhz: [ 868, 1800, 3500 ]
pl_clip: null
freqs: [ 1, 2, 3 ]

use_approximator_feature: True
use_transmittance_loss: True

# Sparse measurement controls
sparse_range: [ 0.0, 0.01 ]

# Modality dropout controls
# prob of turning off one modality (trans+ref OR sparse measurements)
modality_dropout_prob: 0.6666
# If dropout happens, prob of choosing sparse to turn off (vs trans+ref)
sparse_dropout_given_dropout: 0.5

# Data augmentation parameters
augment_val: False
aug_p: 0.0
walls_aug_p: 0.0
transmittance_range: [ 2, 18 ]
angle_range: [ 0, 0 ]
scale_range: [ 1.0, 1.0 ]
flip_vertical: True
flip_horizontal: True
cardinal_rotation: True

# Experiment controls
use_synthetic_train: False
use_small_train: False
train_manifest_path: ${oc.env:ICASSP_TRAIN_MANIFEST}
train_small_manifest_path: ${oc.env:ICASSP_TRAIN_SMALL_MANIFEST}
val_manifest_path: ${oc.env:ICASSP_VAL_MANIFEST}
synthetic_manifest_path: ${oc.env:SYNTH_TRAIN_MANIFEST}
synthetic_val_manifest_path: ${oc.env:SYNTH_VAL_MANIFEST}
synthetic_limit: null
train_samples_per_epoch: null
multi_gpu: False
