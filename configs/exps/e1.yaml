e1:
  ckpt_path: null
  load_weights_only: False
  
  defaults:
    - trainer: default
    - datamodule: indoor
    - optimizer: adam
    - scheduler: null
    - algorithm: indoor
    - network: txunet
    - callbacks: [ tqdm_progress_bar, model_checkpoint_0 ]
    - loggers: [ aim ]
    - strategy: null
    - _self_

  datamodule:
    name: icassp_train_full
    train_samples_per_epoch: 960
    # Modality dropout: prob of turning off one modality (trans+ref OR sparse)
    modality_dropout_prob: 0.6666
    # If dropout happens, prob of choosing sparse to turn off (vs trans+ref)
    sparse_dropout_given_dropout: 0.5

  callbacks:
    model_checkpoint_0:
      dirpath: runs/e1/checkpoints/hard

  loggers:
    aim:
      experiment: v2_e1
