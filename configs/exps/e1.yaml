e1:
  split_role: train_full
  ckpt_path: null
  load_weights_only: False
  
  defaults:
    - trainer: default
    - datamodule: mlsp
    - optimizer: lamb
    - scheduler: wsd_s_finetune_bs80
    - algorithm: mlsp
    - network: mlsp_txunet
    - callbacks: [ tqdm_progress_bar, model_checkpoint_0 ]
    - loggers: [ aim ]
    - strategy: null
    - _self_

  datamodule:
    name: icassp_train_full
    icassp_train_buildings: train_full
    icassp_val_buildings: validation  # resolved from split.json by orchestrator
    split_save_path: ./splits/e1.pkl
    train_samples_per_epoch: 3000
    # Modality dropout: prob of turning off one modality (trans+ref OR sparse)
    modality_dropout_prob: 1
    # If dropout happens, prob of choosing sparse to turn off (vs trans+ref)
    sparse_dropout_given_dropout: 1

  callbacks:
    model_checkpoint_0:
      dirpath: runs/e1/checkpoints/hard

  loggers:
    aim:
      experiment: v1_e1
