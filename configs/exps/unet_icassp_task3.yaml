unet_icassp_task3:
  ckpt_path: null
  load_weights_only: False

  defaults:
    - trainer: default
    - datamodule: icassp_task3
    - optimizer: adam
    - scheduler: icassp3_sd_finetune_32
    - algorithm: indoor
    - network: unet
    - callbacks: [ tqdm_progress_bar, model_checkpoint_0, model_checkpoint_every_4, val_alias_e3 ]
    - loggers: [ aim ]
    - strategy: null
    - _self_

  trainer:
    max_epochs: 32

  datamodule:
    train_samples_per_epoch: 22200

  callbacks:
    model_checkpoint_0:
      dirpath: runs/unet_icassp_task3/checkpoints/hard

  loggers:
    aim:
      experiment: v4_unet_icassp_task3
